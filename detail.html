<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 移除base标签，使用相对路径 -->
    <title>作品详情</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header>
    <h1>作品详情</h1>
    <nav>
        <ul>
            <li><a href="./index.html">返回首页</a></li>
            <li><a href="./gallery.html">作品展厅</a></li>
            <li><a href="./index_3d.html">3D展示</a></li>
            <li><button id="themeBtn">切换主题</button></li>
        </ul>
    </nav>
</header>

<section class="detail-container">
    <!-- 图片操作区 -->
    <div class="img-box">
        <button id="prevBtn">←</button>
        <img id="detailImg" draggable="false">
        <button id="nextBtn">→</button>
    </div>

    <!-- 作品信息 -->
    <div class="info-box" id="artInfo"></div>

    <!-- 操作按钮 -->
    <div class="tool-box">
        <button id="fullscreen">全屏查看</button>
        <button id="downloadBtn">下载作品（带水印）</button>
        <button id="likeBtn">👍 点赞</button>
        <button id="collectBtn">⭐ 收藏</button>
    </div>

    <!-- 评论区（非匿名） -->
    <div class="comment-box">
        <h3>评论区</h3>
        <input type="text" id="username" placeholder="请输入昵称（必填）" required>
        <textarea id="commentContent" placeholder="说点什么..."></textarea>
        <button id="submitComment">发布评论</button>
        <div id="commentList"></div>
    </div>
</section>

<footer>
    <p>© 2026 我的美术作品 | 纯前端展示站</p>
</footer>

<script src="./js/config.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
