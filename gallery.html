<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品展示 - Asuka's Art Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ==================== 画廊页面专属样式 ==================== */
        
        /* 页头固定定位：粘性布局，保持在顶部 */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        /* 轮播图容器：与首页保持一致的样式 */
        .slider-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 30px;
            overflow: hidden;
            border-radius: 20px;
            position: relative;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: var(--card);
            backdrop-filter: blur(10px);
        }
        
        .slider {
            display: flex;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.3s;
        }
        
        .slider-btn:hover {
            background: #fff;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .slider-btn.prev { left: 20px; }
        .slider-btn.next { right: 20px; }
        
        /* 画廊标题：渐变文字，带淡入动画 */
        .gallery h2 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease;
        }
    </style>
</head>
<body>
<!-- ==================== 页面头部（包含汉堡菜单和导航） ==================== -->
<header>
    <!-- 汉堡菜单按钮：仅在移动端显示 -->
    <button class="hamburger" id="hamburgerBtn" aria-label="菜单">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <!-- 导航菜单 -->
    <nav class="gallery-page-nav">
        <ul id="navMenu">
            <li><a href="index.html">🏠 返回首页</a></li>
            <li><a href="gallery.html" class="active">🎨 作品展厅</a></li>
            <li><a href="index_3d.html">🎭 3D 展示</a></li>
            <li><button class="tab-btn active" data-tab="middle">high school level</button></li>
            <li><button class="tab-btn" data-tab="college">college level</button></li>
            <li><button id="themeBtn">☀️ 夜间模式</button></li>
        </ul>
    </nav>
</header>

<!-- ==================== 浮动装饰气泡（全页面通用） ==================== -->
<div id="floatingBubbles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></div>

<!-- ==================== 轮播图区域 ==================== -->
<section class="slider-container">
    <button class="slider-btn prev" onclick="prevSlide()">←</button>
    <div class="slider" id="slider"></div>
    <button class="slider-btn next" onclick="nextSlide()">→</button>
</section>

<!-- ==================== 作品列表区域 ==================== -->
<section class="gallery">
    <h2>🎨 精选作品展示</h2>
    <div class="grid-container" id="artGrid"></div>
</section>

<footer>
    <div class="footer-content">
        <div class="footer-logo">🎨 Asuka's Art Portfolio</div>
        <div class="footer-contact">
            <div><i>💬</i> QQ: 1946620514</div>
            <div><i>📧</i> Email: 23069100154@stu.xidian.edu.cn</div>
        </div>
        <div class="footer-copyright">
            © 2026 All Rights Reserved | Personal Art Exhibition
        </div>
    </div>
</footer>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
    /* ==================== 汉堡菜单交互逻辑 ==================== */
    // 获取 DOM 元素
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');
    
    // 点击事件监听：切换菜单展开/收起状态
    hamburgerBtn?.addEventListener('click', () => {
        hamburgerBtn.classList.toggle('active');
        navMenu.classList.toggle('active');
    });
</script>
</body>
</html>
