<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asuka's Art Gallery - 个人美术作品集</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 首页专属动画样式 */
        .immersive-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .immersive-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: imageLoadUltra 5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        
        @keyframes imageLoadUltra {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
                filter: blur(20px) brightness(0.3);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05) rotate(2deg);
                filter: blur(5px) brightness(0.7);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0) brightness(1);
            }
        }
        
        .immersive-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 60px 20px 40px;
            color: white;
            text-align: center;
            z-index: 10;
        }
        
        .enter-gallery-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 50px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #f093fb);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            z-index: 20;
        }
        
        .immersive-container:hover .enter-gallery-btn {
            opacity: 1;
            pointer-events: auto;
        }
        
        .enter-gallery-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 15px 60px rgba(102, 126, 234, 0.6);
        }
        

        
        /* 粒子背景效果 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }
        
        /* 标题动画 */
        .title-animation {
            animation: titleReveal 1.5s ease-out;
        }
        
        @keyframes titleReveal {
            0% {
                opacity: 0;
                transform: translateY(50px);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        
        /* 轮播容器增强样式 */
        .slider-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 30px;
            overflow: hidden;
            border-radius: 20px;
            position: relative;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: var(--card);
            backdrop-filter: blur(10px);
        }
        
        .slider {
            display: flex;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.3s;
        }
        
        .slider-btn:hover {
            background: #fff;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .slider-btn.prev { left: 20px; }
        .slider-btn.next { right: 20px; }
        
        /* 画廊区域 */
        .gallery-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 40px;
            text-align: center;
        }
        
        .gallery-nav {
            background: var(--card);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .gallery-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 0;
            padding: 0;
        }
        
        .gallery-section h2 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
