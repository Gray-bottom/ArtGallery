<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asuka's Art Gallery - 个人美术作品集</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ==================== 首页专属动画样式 ==================== */
        
        /* 沉浸式展示容器：全屏显示，居中对齐 */
        .immersive-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 沉浸式图片：自适应大小，带超级加载动画（5 秒缓动） */
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: imageLoadUltra 5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        
        /* 图片加载动画关键帧：从模糊旋转到清晰展现的平滑过渡 */
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
                filter: blur(20px) brightness(0.3);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05) rotate(2deg);
                filter: blur(5px) brightness(0.7);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0) brightness(1);
            }
        }
        
        /* 底部信息遮罩层：渐变透明背景，固定在底部 */
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 60px 20px 40px;
            color: white;
            text-align: center;
            z-index: 10;
        }
        
        /* 中央进入按钮：悬停时显示，带渐变背景和阴影 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 50px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #f093fb);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            z-index: 20;
        }
        
        /* 鼠标悬停容器时显示按钮 */
            opacity: 1;
            pointer-events: auto;
        }
        
        /* 按钮悬停效果：放大并增强阴影 */
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 15px 60px rgba(102, 126, 234, 0.6);
        }
        

        
        /* ==================== 粒子背景效果 ==================== */
        /* 粒子容器：覆盖整个页面，不响应鼠标事件 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        /* 单个粒子：圆形，带浮动动画 */
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        /* 粒子浮动动画关键帧：从底部缓缓上升并消失 */
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }
        
        /* ==================== 标题动画 ==================== */
        /* 标题淡入动画类 */
        .title-animation {
            animation: titleReveal 1.5s ease-out;
        }
        
        /* 标题揭示动画关键帧：从下方模糊位置淡入并清除模糊 */
            0% {
                opacity: 0;
                transform: translateY(50px);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        
        /* ==================== 轮播容器增强样式 ==================== */
        /* 轮播图容器：固定 16:9 比例，带玻璃态效果 */
        .slider-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 30px;
            overflow: hidden;
            border-radius: 20px;
            position: relative;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: var(--card);
            backdrop-filter: blur(10px);
        }
        
        /* 轮播图滑块：使用 flex 布局横向排列图片 */
            display: flex;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        /* 轮播图切换按钮：绝对定位在两侧，带毛玻璃效果 */
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.3s;
        }
        
        /* 按钮悬停效果：变白并放大 */
            background: #fff;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        /* 左右按钮位置 */
        .slider-btn.prev { left: 20px; }
        .slider-btn.next { right: 20px; }
        
        /* ==================== 画廊区域 ==================== */
        /* 画廊区块：居中显示，最大宽度限制 */
        .gallery-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 40px;
            text-align: center;
        }
        
        .gallery-nav {
            background: var(--card);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .gallery-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 0;
            padding: 0;
        }
        
        .gallery-section h2 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<!-- 沉浸式展示区 -->
<section class="immersive-container" id="immersiveContainer">
    <!-- 粒子效果 -->
    <div class="particles" id="particles"></div>
    
    <img src="images/college/college_37.jpg" alt="College Works 37" class="immersive-image" id="immersiveImg">

    <!-- 顶部导航 - 改为左侧固定玻璃态样式 -->
    <nav class="nav-overlay" style="position: fixed; top: 20px; left: 20px; right: auto; transform: none; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); padding: 15px 25px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); border: 1px solid rgba(255, 255, 255, 0.2); z-index: 1000;">
        <button class="hamburger" id="hamburgerBtnIndex" aria-label="菜单" style="display: none; flex-direction: column; background: transparent; border: none; cursor: pointer; padding: 8px; z-index: 1001; position: absolute; left: -50px; top: 50%; transform: translateY(-50%);">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul id="navMenuIndex">
            <li><a href="gallery.html" class="active">🎨 作品展厅</a></li>
            <li><a href="index_3d.html">🎭 3D 展示</a></li>
            <li><button id="themeBtn">☀️ 夜间模式</button></li>
        </ul>
    </nav>

    <!-- 中央按钮 -->
    <button class="enter-gallery-btn" id="centerEnterBtn">✨ 进入作品展厅 →</button>

    <!-- 底部信息 -->
    <div class="immersive-overlay title-animation">
        <h1 style="margin: 0 0 15px 0; font-size: 3.5em; font-weight: 800;">Asuka's Art Gallery</h1>
        <p style="margin: 0; font-size: 1.4em; opacity: 0.9;">个人美术作品展示 · 创意与激情的完美融合</p>
    </div>
</section>



<!-- 主题装饰元素 -->
<div class="theme-decor">
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="stars" id="stars"></div>
</div>

<!-- 浮动装饰气泡 -->
<div id="floatingBubbles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></div>

<!-- 作品列表（初始隐藏） -->
<section class="gallery-section" id="gallerySection" style="display: none;">
    <!-- 导航栏 - 左侧固定玻璃态样式 -->
    <nav class="nav-overlay" style="position: fixed; top: 20px; left: 20px; right: auto; transform: none; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); padding: 15px 25px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); border: 1px solid rgba(255, 255, 255, 0.2); z-index: 1000;">
        <button class="hamburger" id="hamburgerBtn2" aria-label="菜单" style="display: none; flex-direction: column; background: transparent; border: none; cursor: pointer; padding: 8px; z-index: 1001; position: absolute; left: -50px; top: 50%; transform: translateY(-50%);">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul id="navMenu2">
            <li><a href="index.html">🏠 返回首页</a></li>
            <li><a href="gallery.html" class="active">🎨 作品展厅</a></li>
            <li><a href="index_3d.html">🎭 3D 展示</a></li>
            <li><button class="tab-btn active" data-tab="middle">high school level</button></li>
            <li><button class="tab-btn" data-tab="college">college level</button></li>
            <li><button id="themeBtn2">☀️ 夜间模式</button></li>
        </ul>
    </nav>

    <!-- 轮播图 -->
    <section class="slider-container">
        <button class="slider-btn prev" onclick="prevSlide()">←</button>
        <div class="slider" id="slider"></div>
        <button class="slider-btn next" onclick="nextSlide()">→</button>
    </section>

    <!-- 作品列表标题 -->
    <h2>🎨 精选作品展示</h2>
    <div class="grid-container" id="artGrid"></div>
</section>

<footer>
    <div class="footer-content">
        <div class="footer-logo">🎨 Asuka's Art Portfolio</div>
        <div class="footer-contact">
            <div><i>💬</i> QQ: 1946620514</div>
            <div><i>📧</i> Email: 23069100154@stu.xidian.edu.cn</div>
        </div>
        <div class="footer-copyright">
            © 2026 All Rights Reserved | Personal Art Exhibition
        </div>
    </div>
</footer>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
    /* ==================== 首页汉堡菜单交互逻辑 ==================== */
    const hamburgerBtnIndex = document.getElementById('hamburgerBtnIndex');
    const navMenuIndex = document.getElementById('navMenuIndex');
    
    hamburgerBtnIndex?.addEventListener('click', () => {
        hamburgerBtnIndex.classList.toggle('active');
        navMenuIndex.classList.toggle('active');
    });
    
    /* ==================== 画廊区域汉堡菜单交互逻辑 ==================== */
    const hamburgerBtn2 = document.getElementById('hamburgerBtn2');
    const navMenu2 = document.getElementById('navMenu2');
    
    hamburgerBtn2?.addEventListener('click', () => {
        hamburgerBtn2.classList.toggle('active');
        navMenu2.classList.toggle('active');
    });
    
    /* ==================== 移动端响应式 ==================== */
    function checkMobileNav() {
        const isMobile = window.innerWidth <= 768;
        
        // 首页导航
        if (hamburgerBtnIndex && navMenuIndex) {
            if (isMobile) {
                hamburgerBtnIndex.style.display = 'flex';
                navMenuIndex.style.position = 'fixed';
                navMenuIndex.style.top = '80px';
                navMenuIndex.style.left = '0';
                navMenuIndex.style.right = '0';
                navMenuIndex.style.background = 'rgba(255, 255, 255, 0.98)';
                navMenuIndex.style.backdropFilter = 'blur(20px)';
                navMenuIndex.style.flexDirection = 'column';
                navMenuIndex.style.padding = '20px';
                navMenuIndex.style.gap = '10px';
                navMenuIndex.style.transform = 'translateY(-150%)';
                navMenuIndex.style.opacity = '0';
                navMenuIndex.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                navMenuIndex.style.boxShadow = '0 10px 40px rgba(0,0,0,0.2)';
                navMenuIndex.style.zIndex = '999';
            } else {
                hamburgerBtnIndex.style.display = 'none';
                navMenuIndex.style.position = 'static';
                navMenuIndex.style.background = 'transparent';
                navMenuIndex.style.backdropFilter = 'none';
                navMenuIndex.style.flexDirection = 'row';
                navMenuIndex.style.padding = '0';
                navMenuIndex.style.gap = '12px';
                navMenuIndex.style.transform = 'none';
                navMenuIndex.style.opacity = '1';
                navMenuIndex.style.boxShadow = 'none';
            }
        }
        
        // 画廊区域导航
        if (hamburgerBtn2 && navMenu2) {
            if (isMobile) {
                hamburgerBtn2.style.display = 'flex';
                navMenu2.style.position = 'fixed';
                navMenu2.style.top = '80px';
                navMenu2.style.left = '0';
                navMenu2.style.right = '0';
                navMenu2.style.background = 'rgba(255, 255, 255, 0.98)';
                navMenu2.style.backdropFilter = 'blur(20px)';
                navMenu2.style.flexDirection = 'column';
                navMenu2.style.padding = '20px';
                navMenu2.style.gap = '10px';
                navMenu2.style.transform = 'translateY(-150%)';
                navMenu2.style.opacity = '0';
                navMenu2.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                navMenu2.style.boxShadow = '0 10px 40px rgba(0,0,0,0.2)';
                navMenu2.style.zIndex = '999';
            } else {
                hamburgerBtn2.style.display = 'none';
                navMenu2.style.position = 'static';
                navMenu2.style.background = 'transparent';
                navMenu2.style.backdropFilter = 'none';
                navMenu2.style.flexDirection = 'row';
                navMenu2.style.padding = '0';
                navMenu2.style.gap = '12px';
                navMenu2.style.transform = 'none';
                navMenu2.style.opacity = '1';
                navMenu2.style.boxShadow = 'none';
            }
        }
    }
    
    // 初始检查和窗口大小变化时调整
    checkMobileNav();
    window.addEventListener('resize', checkMobileNav);
</script>
</body>
</html>
