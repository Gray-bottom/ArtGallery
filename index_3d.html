<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asuka's 3D Art Gallery</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* 全屏3D画廊容器 */
        .gallery-3d-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 2000px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        /* 3D旋转舞台 */
        .carousel-3d {
            position: relative;
            width: 700px;
            height: 500px;
            transform-style: preserve-3d;
            transform: rotateX(10deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 3D卡片样式 */
        .card-3d {
            position: absolute;
            width: 400px;
            height: 300px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 悬停放大效果 */
        .card-3d:hover {
            transform: scale(1.1) translateY(-20px) !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            z-index: 100 !important;
        }

        .card-3d img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card-3d:hover img {
            transform: scale(1.1);
        }

        /* 卡片标题 */
        .card-title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card-3d:hover .card-title {
            opacity: 1;
        }

        /* 控制按钮 */
        .controls {
            position: absolute;
            bottom: 100px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* 导航栏 */
        .nav-3d {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 200;
        }

        .nav-3d ul {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
        }

        .nav-3d button {
            color: white;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .nav-3d button:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        /* 指示器 */
        .indicator {
            position: absolute;
            bottom: 50px;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .carousel-3d {
                width: 90vw;
                height: 60vh;
            }

            .card-3d {
                width: 80vw;
                height: 50vh;
            }

            .controls {
                bottom: 80px;
            }
        }
    </style>
</head>
<body>
<!-- 3D 页面导航 -->
<nav class="nav-3d">
    <ul>
        <li><button id="themeBtn">切换主题</button></li>
    </ul>
</nav>

<!-- 3D 旋转画廊 -->
<section class="gallery-3d-container">
    <div class="carousel-3d" id="carousel3D"></div>

    <!-- 控制按钮 -->
    <div class="controls">
        <button class="control-btn" id="prevBtn">←</button>
        <button class="control-btn" id="nextBtn">→</button>
    </div>

    <!-- 指示器 -->
    <div class="indicator" id="indicators"></div>
</section>

<footer>
    <div class="footer-content">
        <div class="footer-logo">🎨 Asuka's Copy Painting Portfolio</div>
        <div class="footer-contact">
            <div><i>💬</i> QQ: 1946620514</div>
            <div><i>📧</i> Email: 23069100154@stu.xidian.edu.cn</div>
        </div>
        <div class="footer-copyright">© 2026 All Rights Reserved</div>
    </div>
</footer>

<script src="./js/config.js"></script>
<script src="./js/main.js"></script>
<script>
    // 等待DOM完全加载
    document.addEventListener('DOMContentLoaded', function() {
        // 获取DOM元素
        const carousel = document.getElementById('carousel3D');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indicatorsContainer = document.getElementById('indicators');

        // 配置参数
        const totalCards = 8; // 同时显示的卡片数量
        const radius = 300; // 旋转半径
        let currentAngle = 0;
        let isAnimating = false;

        // 筛选并获取最新的作品
        const collegeWorks = artWorks.filter(item => item.type === 'college');
        const recentWorks = collegeWorks.slice(-totalCards);

        // 创建3D卡片
        function createCard(work, index) {
            const angle = (index * (360 / totalCards)) * Math.PI / 180;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;

            const card = document.createElement('div');
            card.className = 'card-3d';
            card.style.transform = `translateX(${x}px) translateZ(${z}px)`;

            // 使用相对路径确保图片正确加载
            const imgSrc = work.src.startsWith('./') ? work.src : './' + work.src;
            card.innerHTML = `
                <img src="${imgSrc}.jpg" alt="${work.name}" onerror="this.outerHTML='<div class=\\'img-placeholder\\'><div>👽</div><div>Image Not Found</div></div>'">
                <div class="card-title">${work.name}</div>
            `;

            // 点击卡片进入详情页
            card.addEventListener('click', () => {
                window.location.href = `detail.html?id=${work.id}`;
            });

            return card;
        }

        // 更新旋转角度（平滑过渡）
        function updateCarousel(angle) {
            if (isAnimating) return;
            isAnimating = true;

            // 应用新的变换
            carousel.style.transform = `rotateX(10deg) rotateY(${-angle}deg)`;

            // 延迟重置动画状态
            setTimeout(() => {
                isAnimating = false;
            }, 500);
        }

        // 渲染3D画廊
        function renderCarousel() {
            carousel.innerHTML = '';
            indicatorsContainer.innerHTML = '';

            // 创建所有卡片
            recentWorks.forEach((work, index) => {
                const card = createCard(work, index);
                carousel.appendChild(card);

                // 创建指示器点
                const dot = document.createElement('div');
                dot.className = index === 0 ? 'dot active' : 'dot';
                dot.dataset.index = index;
                dot.addEventListener('click', () => {
                    const targetIndex = parseInt(dot.dataset.index);
                    currentAngle = targetIndex * (360 / totalCards);
                    updateIndicators(targetIndex);
                    updateCarousel(currentAngle);
                });
                indicatorsContainer.appendChild(dot);
            });

            updateIndicators(0);
        }

        // 更新指示器
        function updateIndicators(activeIndex) {
            document.querySelectorAll('.dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === activeIndex);
            });
        }

        // 事件处理
        prevBtn.addEventListener('click', () => {
            currentAngle -= 360 / totalCards;
            updateCarousel(currentAngle);
            const activeIndex = Math.abs(Math.round(currentAngle / (360 / totalCards))) % totalCards;
            updateIndicators(activeIndex);
        });

        nextBtn.addEventListener('click', () => {
            currentAngle += 360 / totalCards;
            updateCarousel(currentAngle);
            const activeIndex = Math.abs(Math.round(currentAngle / (360 / totalCards))) % totalCards;
            updateIndicators(activeIndex);
        });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevBtn.click();
            if (e.key === 'ArrowRight') nextBtn.click();
        });

        // 触摸滑动控制
        let touchStartX = 0;
        let touchEndX = 0;

        carousel.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        carousel.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextBtn.click();
                } else {
                    prevBtn.click();
                }
            }
        });

        // 主题切换
        const themeBtn = document.getElementById('themeBtn');
        if (themeBtn) {
            themeBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark");
                localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");

                // 更新按钮文本
                updateThemeButtonText();
            });
        }

        function updateThemeButtonText() {
            const themeBtns = document.querySelectorAll('#themeBtn');
            themeBtns.forEach(btn => {
                if (btn) {
                    btn.innerHTML = document.body.classList.contains("dark") ?
                        '<i>🌙</i> 日间模式' :
                        '<i>☀️</i> 夜间模式';
                }
            });
        }

        // 初始化
        renderCarousel();

        // 应用保存的主题设置
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
            updateThemeButtonText();
        }
    });
</script>
</body>
</html>
